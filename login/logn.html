<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | BAF Shaheen College Chattogram</title>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- Login CSS -->
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <!-- ================= LOGIN PAGE ================= -->

    <div class="login-page">

        <!-- Background decoration -->
        <div class="shape shape-one"></div>
        <div class="shape shape-two"></div>


        <!-- Login Box -->
        <div class="login-card">

            <!-- Logo -->
            <div class="login-logo">
                <img
                    src="Screenshot_2026-08-14_194615-removebg-preview.png"
                    alt="BAF Shaheen College Logo"
                >
            </div>


            <!-- Heading -->
            <h1>Welcome Back</h1>

            <p class="login-subtitle">
                Login to your college account
            </p>


            <!-- Login Form -->
            <form id="loginForm">


                <!-- Login ID -->
                <div class="input-group">

                    <label for="loginId">
                        Login ID
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-user"></i>

                        <input
                            type="text"
                            id="loginId"
                            placeholder="Enter your Login ID"
                            required
                        >

                    </div>

                </div>


                <!-- Password -->
                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="togglePassword"
                        >
                            <i class="fa-solid fa-eye"></i>
                        </button>

                    </div>

                </div>


                <!-- Remember / Forgot -->
                <div class="login-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="remember"
                        >

                        <span>Remember me</span>

                    </label>


                    <a href="#" id="forgotPassword">
                        Forgot Password?
                    </a>

                </div>


                <!-- Login Button -->
                <button
                    type="submit"
                    class="login-btn"
                >

                    <span>Login</span>

                    <i class="fa-solid fa-arrow-right"></i>

                </button>


                <!-- Message -->
                <div
                    id="loginMessage"
                    class="login-message"
                ></div>

            </form>


            <!-- Back Home -->
            <a
                href="../index.html"
                class="back-home"
            >
                <i class="fa-solid fa-arrow-left"></i>
                Back to Home
            </a>

        </div>

    </div>


    <!-- Login JS -->
    <script src="login.js"></script>

</body>

</html>
